name = "bobs-cloudflare-mcp"
main = "src/index.ts"
compatibility_date = "2024-11-01"

[[durable_objects.bindings]]
name = "LEARNINGS_HUB"
class_name = "LearningsHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LearningsHub"]

# Inlines the generated Markdown and the landing-page HTML as plain text
# strings at build time — see scripts/build-content.ts and src/learnings-hub.ts.
[[rules]]
type = "Text"
globs = ["**/*.md", "**/*.html"]
fallthrough = true
