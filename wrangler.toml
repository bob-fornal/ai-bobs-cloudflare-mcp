name = "cloudflare-mcp"
main = "src/index.ts"
compatibility_date = "2024-11-01"
# Required at runtime by the `agents` package's internal use of node:async_hooks —
# our own Worker code does not use any Node built-ins (see SKILL_CLOUDFLARE_EDGE).
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "LEARNINGS_HUB"
class_name = "LearningsHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LearningsHub"]

# Inlines the generated Markdown and the landing-page HTML as plain text
# strings at build time — see scripts/build-content.ts and src/learnings-hub.ts.
[[rules]]
type = "Text"
globs = ["**/*.md", "**/*.html"]
fallthrough = true
